version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint
    - contextcheck
    - bodyclose
    - noctx
    - gosec
    - gocritic
    - nilerr
    - unconvert
    - unparam
    - misspell
  settings:
    gosec:
      excludes:
        # Variable paths are inherent to a downloader; the filesystem layer is
        # where traversal is prevented.
        - G304
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, unparam]

formatters:
  enable:
    - gofmt
