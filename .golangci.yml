version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint
    - contextcheck
    - bodyclose
    - noctx
    - gosec
    - gocritic
    - nilerr
    - unconvert
    - unparam
    - misspell
  settings:
    gosec:
      excludes:
        # Variable paths are inherent to a downloader; the filesystem layer is
        # where traversal is prevented.
        - G304
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, unparam]
      # gocritic analyses cgo files through the rewritten source cgo generates,
      # then maps the position back: on the decoder glue it reports a
      # dupSubExpr whose offset is past the end of the file. go-critic on its own
      # reports nothing there, so the check is off for that one file rather than
      # for cgo everywhere.
      - path: internal/lzma/cgo\.go
        linters: [gocritic]
        text: dupSubExpr
      # The build driver does what its command line says: it runs go, git and
      # golangci-lint, and it writes the binary where -o points. gosec's taint
      # analysis starts at os.Args, so it reports each of those as injection,
      # traversal or an unbounded index -- which here is the driver's job description,
      # not a finding. There is no caller above it to validate against. What the
      # arguments mean is unit-tested in this package.
      - path: ^bootstrap/
        linters: [gosec]
        text: G204|G602|G702|G703

formatters:
  enable:
    - gofmt
