name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      # cgo builds the archive extractor, and the driver names the compiler rather than
      # leaving it to the machine; see bootstrap/main.go for which one and why. Pinned,
      # so a zig release cannot change what CI builds.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: go run ./bootstrap build

      # The race detector needs tsan symbols, which zig does not provide, so a race
      # build is left to the host's own compiler.
      - name: Test (race)
        run: go run ./bootstrap test -race

  # The Linux C toolchain is pinned to a glibc floor rather than to whatever the runner
  # image ships. This job is what says so out loud: one build, run inside a
  # distribution at the floor, above it, and below it.
  glibc-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: go run ./bootstrap build -o dist/qtogo

      - name: At the floor and above it, the binary runs
        run: |
          for image in debian:11 ubuntu:22.04; do
            echo "== $image"
            docker run --rm -v "$PWD/dist:/dist:ro" "$image" /dist/qtogo version
          done

      - name: Below the floor it does not
        run: |
          if docker run --rm -v "$PWD/dist:/dist:ro" centos:7 /dist/qtogo version; then
            echo "the binary started on a glibc older than the floor it claims" >&2
            exit 1
          fi
          echo "refused, as it should be"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      # Only the ANSI-C decoder is vendored (see THIRD-PARTY.md). A CPP/7zip path
      # is the SDK's C++ side, under a different licence; this keeps one from
      # entering the tree.
      - name: no C++ side of the SDK
        run: |
          if git ls-files | grep -F 'CPP/7zip'; then
            echo "the vendored SDK must stay C/ only; found a CPP/7zip path" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The action downloads the prebuilt release binary and caches the run,
      # instead of compiling golangci-lint from source on every job.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      # govulncheck ships no prebuilt binary, so the tool version is pinned (for
      # reproducible runs) and setup-go's build cache absorbs the compile.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: go mod tidy
        run: go mod tidy

      - name: go.mod and go.sum are current
        run: test -z "$(git status --porcelain -- go.mod go.sum)"
