name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      # cgo builds the archive extractor, and the driver names the compiler rather than
      # leaving it to the machine; see bootstrap/main.go for which one and why. The
      # version is pinned, so a zig release cannot change what CI builds.
      - name: Restore zig
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig
          key: zig-0.17.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install zig
        shell: bash
        env:
          ZIG_DIR: ${{ runner.temp }}/zig
        run: |
          bash .github/scripts/install-zig.sh 0.17.0 "$ZIG_DIR"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"

      - name: Build
        run: go run ./bootstrap build

      # The race detector needs tsan symbols, which zig does not provide, so a race
      # build is left to the host's own compiler.
      - name: Test (race)
        run: go run ./bootstrap test -race

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      # Only the ANSI-C decoder is vendored (see THIRD-PARTY.md). A CPP/7zip path
      # is the SDK's C++ side, under a different licence; this keeps one from
      # entering the tree.
      - name: no C++ side of the SDK
        run: |
          if git ls-files | grep -F 'CPP/7zip'; then
            echo "the vendored SDK must stay C/ only; found a CPP/7zip path" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The action downloads the prebuilt release binary and caches the run,
      # instead of compiling golangci-lint from source on every job.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      # govulncheck ships no prebuilt binary, so the tool version is pinned (for
      # reproducible runs) and setup-go's build cache absorbs the compile.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: go mod tidy
        run: go mod tidy

      - name: go.mod and go.sum are current
        run: test -z "$(git status --porcelain -- go.mod go.sum)"
