name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      # cgo builds the archive extractor, and the driver names the compiler rather than
      # leaving it to the machine; see bootstrap/main.go for which one and why. The
      # version is pinned, so a zig release cannot change what CI builds.
      - name: Restore zig
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig
          key: zig-0.17.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install zig
        shell: bash
        env:
          ZIG_DIR: ${{ runner.temp }}/zig
        run: |
          bash .github/scripts/install-zig.sh 0.17.0 "$ZIG_DIR"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"

      - name: Build
        run: go run ./bootstrap build

      # The race detector needs tsan symbols, which zig does not provide, so a race
      # build is left to the host's own compiler.
      - name: Test (race)
        run: go run ./bootstrap test -race

  # The Linux build names the glibc it is built against rather than inheriting the
  # runner image's, and this job is what says whether that promise holds: one build,
  # checked for what it needs, then started where that requirement is the floor.
  glibc-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Restore zig
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig
          key: zig-0.17.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install zig
        shell: bash
        env:
          ZIG_DIR: ${{ runner.temp }}/zig
        run: |
          bash .github/scripts/install-zig.sh 0.17.0 "$ZIG_DIR"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"

      - name: Build
        run: go run ./bootstrap build -o dist/qtogo

      - name: It needs no glibc newer than the floor
        run: |
          floor=2.31
          # Nothing today: the linker produces a static binary, so it needs no glibc at
          # all and starts on distributions far older than the floor. This is what says
          # whether that is still true, and whether the floor is still the thing
          # protecting the binary if it stops being.
          highest=$(objdump -T dist/qtogo 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 || true)
          echo "highest glibc requirement: ${highest:-none, the binary is linked statically}"
          if [ -n "$highest" ] &&
            [ "$(printf 'GLIBC_%s\n%s\n' "$floor" "$highest" | sort -V | tail -1)" != "GLIBC_$floor" ]; then
            echo "the binary requires $highest, which is newer than the $floor floor" >&2
            exit 1
          fi

      - name: At the floor and above it, the binary starts
        run: |
          for image in debian:11 ubuntu:22.04; do
            echo "== $image"
            docker run --rm -v "$PWD/dist:/dist:ro" "$image" /dist/qtogo version
          done

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      # Only the ANSI-C decoder is vendored (see THIRD-PARTY.md). A CPP/7zip path
      # is the SDK's C++ side, under a different licence; this keeps one from
      # entering the tree.
      - name: no C++ side of the SDK
        run: |
          if git ls-files | grep -F 'CPP/7zip'; then
            echo "the vendored SDK must stay C/ only; found a CPP/7zip path" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The action downloads the prebuilt release binary and caches the run,
      # instead of compiling golangci-lint from source on every job.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      # govulncheck ships no prebuilt binary, so the tool version is pinned (for
      # reproducible runs) and setup-go's build cache absorbs the compile.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: go mod tidy
        run: go mod tidy

      - name: go.mod and go.sum are current
        run: test -z "$(git status --porcelain -- go.mod go.sum)"
